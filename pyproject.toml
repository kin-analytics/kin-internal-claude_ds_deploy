[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-ds-tools"
version = "0.1.0"
description = "CLI tool to standardize and safely sync the .claude configuration folder across DS projects"
requires-python = ">=3.7"
dependencies = []

[project.scripts]
setup-claude = "claude_fixer.cli:main"

[tool.setuptools.package-data]
"claude_fixer" = ["templates/**/*", "templates/**"]